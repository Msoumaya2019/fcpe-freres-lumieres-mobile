# =============================================================================
#  Build EAS
# =============================================================================
#
#  Déclenchement MANUEL ou sur un tag `v*`, jamais à chaque push : un build EAS
#  consomme du quota, et compiler vingt fois la même journée pour rien est le
#  meilleur moyen d'épuiser le forfait du mois.
#
#  Prérequis : le secret `EXPO_TOKEN` (Settings > Secrets and variables >
#  Actions). Il se crée sur expo.dev, dans Account > Access tokens.
#
#  Les variables EXPO_PUBLIC_* ne sont PAS définies ici : elles vivent dans les
#  environnements EAS, associés aux profils par `eas.json`. Les déclarer aussi
#  dans ce fichier créerait deux sources de vérité, dont l'une finirait par
#  diverger silencieusement.
# =============================================================================

name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profil de build'
        type: choice
        options:
          - preview
          - production
        default: preview
        required: true
      platform:
        description: 'Plateforme'
        type: choice
        options:
          - android
          - ios
          - all
        default: android
        required: true
  push:
    tags:
      - 'v*'

# `contents: write`, et non `read` : la dernière étape dépose le binaire
# compilé dans une **release**, qui est le seul endroit d'où l'adhérent peut le
# télécharger sans compte. Mesuré le 2026-09-19 sur un dépôt public : un asset
# de release répond 302, l'artefact d'un flux répond 401. Un jeton en lecture
# seule ne pourrait pas écrire la release.
permissions:
  contents: write

# Pas d'annulation : un build interrompu peut laisser un artefact incohérent
# côté EAS. Mieux vaut attendre la fin du précédent.
concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          # Même version que `.nvmrc`, `ci.yml` et `eas.json` : l'accord des
          # quatre est vérifié par `scripts/check-build-config.test.mjs`, et non
          # laissé à la mémoire de qui modifie ce fichier.
          node-version: '22.22.2'
          cache: npm

      - name: Installer EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer le build
        # Le workflow attend la fin du build (pas de `--no-wait`) : un statut
        # vert signifie alors réellement « l'artefact est prêt ». Cela consomme
        # des minutes de CI, mais un workflow vert qui ne dit rien de l'état réel
        # du build ne sert à rien.
        env:
          # Un tag `v*` déclenche un build de production ; un déclenchement
          # manuel utilise les valeurs choisies.
          PROFILE: ${{ github.event.inputs.profile || 'production' }}
          PLATFORM: ${{ github.event.inputs.platform || 'android' }}
        run: eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive

      # -----------------------------------------------------------------------
      #  Rendre le binaire atteignable par celui qui doit l'installer
      # -----------------------------------------------------------------------
      #
      #  POURQUOI CETTE ÉTAPE EXISTE
      #  ---------------------------
      #  EAS affiche en fin de build une adresse — « See logs: …/builds/<id> » —
      #  et elle ne mène à rien pour l'adhérent. Mesuré le 2026-09-19, sans
      #  authentification : la page répond **200**, mais elle est une application
      #  JavaScript dont le HTML ne contient aucune adresse de fichier (62 128
      #  octets, zéro occurrence de `buildUrl`), et l'API refuse la lecture du
      #  build — « Entity not authorized: TurtleBuildEntity[3dab2207-…]
      #  (viewer = AnonymousViewerContext, action = READ) ». Autrement dit, le
      #  seul lien que le service donne est inutilisable par quiconque n'est pas
      #  propriétaire du projet.
      #
      #  Un **asset de release**, lui, se télécharge sans compte. C'est la même
      #  mesure qui l'établit : 302 sur un asset d'un dépôt public, contre 401
      #  pour l'artefact d'un flux. Les deux nombres ont été relevés le même
      #  jour, sur la même machine, sans jeton.
      #
      #  CE QUE CETTE ÉTAPE NE PEUT PAS FAIRE
      #  ------------------------------------
      #  Elle ne peut pas vérifier que le fichier téléchargé est le bon : elle
      #  compare une adresse, pas un contenu. La version, elle, est écrite dans
      #  le nom du fichier — c'est ce qui permet à l'adhérent de reconnaître ce
      #  qu'il installe, et à `scripts/check-release.test.mjs` de tenir l'accord
      #  entre `app.json` et ce que le guide annonce.
      - name: Publier le binaire dans la version
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ github.event.inputs.platform || 'android' }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v$VERSION"

          # La release est créée si elle manque, et c'est le cas normal d'un
          # premier build : `gh release create` crée alors le tag.
          #
          # Ce tag **ne déclenche aucun build de production** — mesuré, et non
          # supposé. La version `v0.1.0` a été créée par ce script le
          # 2026-09-19, et l'historique ne porte aucune exécution sur ce tag.
          # GitHub ne relance pas un flux pour un événement provoqué par
          # `GITHUB_TOKEN`, précisément pour empêcher les boucles : le
          # déclenchement `push: tags: v*` ne vaut que pour un tag poussé à la
          # main. La phrase contraire figurait ici avant d'être mesurée.
          #
          # Ce n'est pas un défaut : publier une prévisualisation ne doit pas
          # consommer un build de production. Pour en obtenir un, poussez le tag
          # — `git push origin v0.1.0`.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # La création peut perdre une course avec l'autre flux, qui publie
            # dans la même version : l'échec est alors sans conséquence. Il n'est
            # pas ignoré pour autant — la suite du script exige que la release
            # existe, et c'est exactement ce que vérifie le bloc suivant.
            gh release create "$TAG" \
              --title "FCPE Frères Lumières $VERSION" \
              --notes "Binaires de la version $VERSION, compilés depuis le commit $GITHUB_SHA." \
              --target "$GITHUB_SHA" || true
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::la version $TAG n'existe pas et n'a pas pu être créée"
            exit 1
          fi

          PLATEFORMES="$PLATFORM"
          if [ "$PLATEFORMES" = "all" ]; then
            PLATEFORMES="android ios"
          fi

          for PLATEFORME in $PLATEFORMES; do
            # Le build le plus récent de cette plateforme : le flux vient de le
            # terminer, et `concurrency` empêche deux builds du même commit de
            # se chevaucher. La liste est filtrée par plateforme, sans quoi un
            # build iOS répondrait à une demande Android.
            URL=$(eas build:list --platform "$PLATEFORME" --limit 1 \
              --non-interactive --json | jq -r '.[0].artifacts.buildUrl')

            if [ -z "$URL" ] || [ "$URL" = "null" ]; then
              echo "::error::aucune adresse d'artefact pour $PLATEFORME — le build a-t-il abouti ?"
              exit 1
            fi

            # L'adresse porte une signature en paramètres : on l'écarte avant de
            # lire l'extension, sinon le nom du fichier contiendrait la requête.
            SANS_PARAMETRES="${URL%%\?*}"
            EXTENSION="${SANS_PARAMETRES##*.}"
            FICHIER="fcpe-freres-lumieres-$VERSION-$PLATEFORME.$EXTENSION"

            curl --fail --location --silent --show-error --output "$FICHIER" "$URL"
            echo "$FICHIER : $(wc -c < "$FICHIER") octets"

            gh release upload "$TAG" "$FICHIER" --clobber
          done

          echo "### Binaires publiés dans la version $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

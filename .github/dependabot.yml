# =============================================================================
#  Dependabot
# =============================================================================
#
#  Une pull request hebdomadaire, groupée par famille de paquets.
#
#  Regroupées, et non une par paquet : dix pull requests ouvertes le même lundi
#  ne sont pas traitées, elles sont ignorées — et une mise à jour de sécurité
#  noyée dans le lot l'est aussi.
#
#  `expo` et `react-native` sont volontairement séparés : leur montée de version
#  s'accompagne de notes de migration, et exige une lecture, pas une fusion
#  automatique.
# =============================================================================

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Correctifs et mineures de l'écosystème Expo : versions liées entre elles,
      # à monter ensemble ou pas du tout.
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
        update-types: ['minor', 'patch']
      react-native:
        patterns:
          - 'react-native'
          - 'react-native-*'
        update-types: ['minor', 'patch']
      # Outillage : aucun impact sur le bundle livré, donc sans risque.
      #
      # `libpg-query` analyse la syntaxe SQL, `@electric-sql/pglite` **exécute**
      # la migration contre un vrai PostgreSQL — tous deux en développement
      # seulement. Une montée de l'un comme de l'autre est sans risque pour une
      # raison précise : les bancs les exercent, donc une rupture de leur part
      # fait tomber `npm run verify` au lieu de passer inaperçue.
      tooling:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'typescript'
          - 'libpg-query'
          - '@electric-sql/pglite'
        update-types: ['minor', 'patch']
      # Reste : Supabase, React Navigation, React.
      other:
        patterns:
          - '*'
        update-types: ['minor', 'patch']

    # Paquets dont la version est épinglée par le SDK d'Expo, et non choisie ici.
    #
    # Relevé le 2026-09-18 sur deux points d'entrée d'`api.expo.dev`, avec
    # `expo@57.0.24` installé :
    #
    #   /v2/sdks/57.0.0/native-modules   → les modules natifs, 123 entrées
    #   /v2/versions/latest              → `sdkVersions["57.0.0"].expoVersion`
    #                                      et `.relatedPackages`
    #
    # **Dix-sept** paquets installés ici y figurent. La liste ci-dessous les nomme
    # tous, et `scripts/check-sdk-pins.test.mjs` tient l'accord : les deux listes
    # doivent nommer les mêmes paquets, dans les deux sens. Le même banc refuse
    # désormais un paquet de l'écosystème installé sans y figurer — c'est ainsi
    # qu'`expo-notifications` a été rattrapé.
    #
    # Sans elle, Dependabot propose des montées qui **passent npm** et divergent en
    # silence de ce que le SDK attend : `react-native@0.86.3` accepte
    # `react: ^19.2.3`, donc rien ne proteste à l'installation. Mesuré — sur sept
    # pull requests ouvertes, six proposaient une version que le SDK refuse.
    #
    # Ces paquets se montent par `npx expo install --fix`, après une montée de SDK,
    # et pas par npm.
    #
    # UNE PULL REQUEST ROUGE ATTENDUE, ET QUI N'EST PAS UN DÉFAUT
    # ----------------------------------------------------------
    # `eslint@10` ne s'installe pas ici, et la pull request échoue en treize
    # secondes sur `ERESOLVE` : `eslint-plugin-react@7.37.5` déclare
    # `peer eslint ^3 || … || ^9.7`. Le conflit vient d'un **pair qui n'a pas
    # encore suivi**, pas de cette configuration — mesuré le 2026-09-19.
    #
    # Elle n'est donc pas inscrite ci-dessous, et c'est volontaire : la liste
    # `ignore` est comparée **dans les deux sens** à `CONTRAINTES_DU_SDK` par
    # `check-sdk-pins`, qui porte sur les versions épinglées par le SDK d'Expo.
    # `eslint` n'en fait pas partie, et l'y ajouter pour faire taire le robot
    # ferait dire au fichier une chose fausse.
    #
    # À traiter le jour où `eslint-plugin-react` annonce la 10 : la montée se
    # fera alors d'elle-même.
    ignore:
      # Épinglage exact : le SDK nomme une version, pas une famille. Aucune montée
      # n'est légitime, pas même un correctif.
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: react
      - dependency-name: react-native
      # Plage « ~X.Y.Z » : le correctif reste légitime, la mineure non.
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: expo
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: expo-constants
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: expo-font
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: expo-linking
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: expo-notifications
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: expo-secure-store
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: expo-splash-screen
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: expo-status-bar
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: expo-system-ui
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: react-native-safe-area-context
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: react-native-screens
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # Plage « ^X.Y.Z » : la mineure reste légitime, la majeure non.
      - dependency-name: '@expo/vector-icons'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
